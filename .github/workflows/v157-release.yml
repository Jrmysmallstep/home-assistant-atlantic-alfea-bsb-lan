name: Atlantic Alféa V1.5.7 — validation et publication
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe Python
        run: python -m compileall -q custom_components/atlantic_alfea_controller tests
      - name: Tests Python de l'intégration
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Vérification syntaxe du synoptique
        run: node --check custom_components/atlantic_alfea_controller/www/pac-synoptique-card.js
      - name: Test thèmes Auto/Clair/Sombre
        run: node tests/test_card_theme.js
      - name: Test éditeur Lovelace
        run: node tests/test_card_visual_editor.js
      - name: Contrôle de version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("custom_components/atlantic_alfea_controller/manifest.json")
          assert json.loads(p.read_text())["version"] == "1.5.7"
          PY
  release:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier V1.5.7 après validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V1.5.7 >/dev/null 2>&1; then
            echo "La release V1.5.7 existe déjà"
            exit 0
          fi
          gh release create V1.5.7 \
            --target "$GITHUB_SHA" \
            --title "Atlantic Alféa BSB-LAN V1.5.7" \
            --notes-file docs/RELEASE_NOTES_V157.md \
            --latest
