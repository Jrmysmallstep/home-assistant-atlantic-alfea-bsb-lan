name: Atlantic Alféa V1.5.17 — états natifs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python et régression
        run: |
          python -m compileall -q custom_components/atlantic_alfea_controller tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript et régression
        run: |
          node --check custom_components/atlantic_alfea_controller/www/pac-synoptique-card.js
          node tests/test_card_compact_orientation.js
          node tests/test_card_pipe_geometry.js
          node tests/test_card_theme.js
          node tests/test_card_visual_editor.js
          node tests/test_card_portrait_regime_v1515.js
      - name: Manifest V1.5.17
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("custom_components/atlantic_alfea_controller/manifest.json")
          assert json.loads(p.read_text())["version"]=="1.5.17"
          PY
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release V1.5.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V1.5.17 >/dev/null 2>&1; then exit 0; fi
          gh release create V1.5.17 \
            --target "$GITHUB_SHA" \
            --title "Atlantic Alféa BSB-LAN V1.5.17" \
            --notes-file docs/RELEASE_NOTES_V1517.md \
            --latest
