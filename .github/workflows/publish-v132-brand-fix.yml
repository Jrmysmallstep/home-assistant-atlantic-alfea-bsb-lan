name: Publish v1.3.2 brand correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v132-brand-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and document brand correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          manifest = Path('custom_components/atlantic_alfea_controller/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '1.3.2'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          readme = Path('README.md')
          text = readme.read_text().replace('> Version actuelle : **1.3.1**', '> Version actuelle : **1.3.2**')
          text = text.replace('La V1.3.1 utilise', 'La V1.3.2 utilise').replace('Limitation de sécurité de la V1.3.1', 'Limitation de sécurité de la V1.3.2')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text()
          entry = '''## 1.3.2\n\nCorrectif visuel de la V1.3.1.\n\n- Remplacement de l’icône provisoire par l’icône Atlantic Alfea BSB-LAN définie pour le projet.\n- Ajout du logo Atlantic Alfea BSB-LAN correspondant.\n- Ressources de marque installées à la racine `brand/` et dans `custom_components/atlantic_alfea_controller/brand/` pour HACS / Home Assistant.\n- Aucun changement de la logique PAC, ECS ou dérogation par rapport à la V1.3.1.\n\n'''
          if '## 1.3.2' not in old:
              changelog.write_text(old.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1))
          PY
          python -m compileall -q custom_components/atlantic_alfea_controller

      - name: Commit v1.3.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/atlantic_alfea_controller/manifest.json README.md CHANGELOG.md
          git commit -m "Release v1.3.2: restore project brand assets"
          git push origin main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create V1.3.2 --target main --title "Atlantic Alfea BSB-LAN v1.3.2" --notes "## Atlantic Alfea BSB-LAN v1.3.2\n\nCorrectif visuel uniquement par rapport à la V1.3.1.\n\n- Restauration de l’icône Atlantic Alfea BSB-LAN définie pour le projet.\n- Ajout du logo correspondant pour HACS / Home Assistant.\n- Aucun changement de la logique PAC, ECS ou dérogation."
