name: Publish v1.3.3 brand correction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate brand assets and bump version
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          for p in [Path('brand/icon.png'), Path('brand/logo.png'), Path('custom_components/atlantic_alfea_controller/brand/icon.png'), Path('custom_components/atlantic_alfea_controller/brand/logo.png')]:
              with Image.open(p) as im:
                  im.verify()
          manifest = Path('custom_components/atlantic_alfea_controller/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '1.3.3'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          readme = Path('README.md')
          text = readme.read_text().replace('> Version actuelle : **1.3.2**', '> Version actuelle : **1.3.3**')
          text = text.replace('La V1.3.2 utilise', 'La V1.3.3 utilise').replace('Limitation de sécurité de la V1.3.2', 'Limitation de sécurité de la V1.3.3')
          readme.write_text(text)
          changelog = Path('CHANGELOG.md')
          old = changelog.read_text()
          entry = '''## 1.3.3\n\nCorrectif des ressources graphiques HACS / Home Assistant.\n\n- Remplacement des PNG corrompus par les vrais logos fournis pour le projet.\n- Validation des fichiers PNG avant publication.\n- Aucun changement fonctionnel de la PAC, de l’ECS ou des dérogations.\n\n'''
          if '## 1.3.3' not in old:
              changelog.write_text(old.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1))
          PY
          python -m compileall -q custom_components/atlantic_alfea_controller
      - name: Commit v1.3.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/atlantic_alfea_controller/manifest.json README.md CHANGELOG.md
          git commit -m "Release v1.3.3: fix brand PNG assets"
          git push origin main
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create V1.3.3 --target main --title "Atlantic Alfea BSB-LAN v1.3.3" --notes "Correctif graphique uniquement : remplacement des PNG corrompus par les vrais logos du projet, validés avant publication. Aucun changement fonctionnel de la PAC, de l’ECS ou des dérogations."
