name: Atlantic Alféa — contrôles synoptique
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe Python et tests
        run: |
          python -m compileall -q custom_components/atlantic_alfea_controller tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tests JavaScript
        run: |
          node --check custom_components/atlantic_alfea_controller/www/pac-synoptique-card.js
          node tests/test_card_theme.js
          node tests/test_card_visual_editor.js
          node tests/test_card_compact_orientation.js
          node tests/test_card_pipe_geometry.js
          node tests/test_card_portrait_regime_v1515.js
          node tests/test_card_native_preset_v1520.js
          node tests/test_card_aerien_v1522.js
      - name: Vérifier version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("custom_components/atlantic_alfea_controller/manifest.json").read_text())
          assert isinstance(m["version"], str) and m["version"]
          PY
