name: Atlantic Alféa V1.5.13 — carte responsive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe Python
        run: python -m compileall -q custom_components/atlantic_alfea_controller tests
      - name: Tests Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Syntaxe JavaScript
        run: node --check custom_components/atlantic_alfea_controller/www/pac-synoptique-card.js
      - name: Thèmes et éditeur
        run: |
          node tests/test_card_theme.js
          node tests/test_card_visual_editor.js
      - name: Layout & intégrité des 65 entités
        run: node tests/test_card_compact_orientation.js
      - name: Version du manifeste
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("custom_components/atlantic_alfea_controller/manifest.json")
          assert json.loads(f.read_text())["version"] == "1.5.13"
          PY
  release:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier V1.5.13
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V1.5.13 >/dev/null 2>&1; then
            echo "V1.5.13 déjà publiée"
            exit 0
          fi
          gh release create V1.5.13 \
            --target "$GITHUB_SHA" \
            --title "Atlantic Alféa BSB-LAN V1.5.13" \
            --notes-file docs/RELEASE_NOTES_V1513.md \
            --latest
