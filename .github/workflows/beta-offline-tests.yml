name: Beta offline checks
on:
  push:
    branches:
      - develop/heating-v1.3.4
  pull_request:
    branches:
      - main
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q custom_components/atlantic_alfea_controller tests
      - name: Simulate global mode commands
        run: python -m unittest discover -s tests -p 'test_*.py' -v
