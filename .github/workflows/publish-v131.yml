name: Publish v1.3.1 consolidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v131.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.3.1 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re, struct, zlib

          root = Path('.')
          comp = root / 'custom_components' / 'atlantic_alfea_controller'

          # 1) Regroup circuit names consistently so HA sorts them by circuit.
          sensor = comp / 'sensor.py'
          s = sensor.read_text()
          replacements = {
              '"Chauffage circuit 1 — État"': '"Circuit 1 — Chauffage — État"',
              '"Chauffage circuit 2 — État"': '"Circuit 2 — Chauffage — État"',
              '"Rafraîchissement circuit 1 — État"': '"Circuit 1 — Rafraîchissement — État"',
              '"Rafraîchissement circuit 2 — État"': '"Circuit 2 — Rafraîchissement — État"',
              '"Chauffage circuit 1 — Consigne départ résultante"': '"Circuit 1 — Chauffage — Consigne départ résultante"',
              '"Chauffage circuit 2 — Consigne départ résultante"': '"Circuit 2 — Chauffage — Consigne départ résultante"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          sensor.write_text(s)

          # 2) Remove raw BSB numeric prefix from the water_heater display attribute.
          wh = comp / 'water_heater.py'
          s = wh.read_text()
          s = s.replace('from .helpers import (\n    async_select_option,', 'from .helpers import (\n    async_select_option,\n    clean_bsb_status,')
          s = s.replace('"etat_ecs_bsb": state_value(self.hass, self._source("dhw_state", 8003)),', '"etat_ecs_bsb": clean_bsb_status(state_value(self.hass, self._source("dhw_state", 8003))),')
          wh.write_text(s)

          # 3) Debounce Climate +/- clicks for 2 s after the last click.
          climate = comp / 'climate.py'
          s = climate.read_text()
          s = s.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport asyncio\nimport logging\n\n', 1)
          s = s.replace('from .polling import async_poll_parameters\n\n_PROFILE_COMFORT', 'from .polling import async_poll_parameters\n\n_LOGGER = logging.getLogger(__name__)\n_OVERRIDE_DEBOUNCE_SECONDS = 2.0\n\n_PROFILE_COMFORT', 1)
          s = s.replace('        self._circuit = circuit\n        self._attr_name', '        self._circuit = circuit\n        self._pending_target_temperature: float | None = None\n        self._pending_base_temperature: float | None = None\n        self._pending_override_task: asyncio.Task | None = None\n        self._attr_name', 1)
          target_needle = '''        mode = self._mode()\n        if mode == MODE_OFF:\n            return None\n\n        effective = state_float('''
          target_repl = '''        mode = self._mode()\n        if mode == MODE_OFF:\n            return None\n\n        # Optimistic target while rapid +/- clicks are grouped.\n        if self._pending_target_temperature is not None:\n            return self._pending_target_temperature\n\n        effective = state_float('''
          s = s.replace(target_needle, target_repl, 1)

          start = s.index('    async def async_set_temperature(self, **kwargs) -> None:\n')
          end = s.index('    async def async_added_to_hass(self) -> None:\n', start)
          replacement = '''    def _cancel_pending_override(self) -> None:\n        """Cancel a not-yet-sent debounced override command."""\n        task = self._pending_override_task\n        self._pending_override_task = None\n        if task is not None and not task.done():\n            task.cancel()\n\n    async def _async_apply_pending_override(self) -> None:\n        """Wait 2 s after the last click, then send one native BSB override."""\n        try:\n            await asyncio.sleep(_OVERRIDE_DEBOUNCE_SECONDS)\n            requested = self._pending_target_temperature\n            base = self._pending_base_temperature\n            if requested is None or base is None:\n                return\n\n            override_active, _override_code, _override_text = self._override_state()\n            if override_active is True:\n                _LOGGER.warning(\n                    "Dérogation circuit %s non envoyée: une dérogation native est déjà active",\n                    self._circuit,\n                )\n                return\n            if override_active is None or self._mode() != MODE_COOL:\n                _LOGGER.warning(\n                    "Dérogation circuit %s non envoyée: état BSB ou mode PAC devenu indisponible",\n                    self._circuit,\n                )\n                return\n\n            offset = round(base - requested, 1)\n            if offset < 0.1 or offset > 5.0:\n                _LOGGER.warning(\n                    "Dérogation circuit %s non envoyée: écart %.1f °C hors plage",\n                    self._circuit, offset,\n                )\n                return\n\n            offset_key, offset_parameter = _PARAM[self._circuit]["override_offset"]\n            offset_entity = self._source(offset_key, offset_parameter)\n            if not offset_entity or offset_entity.split(".", 1)[0] not in {"number", "text"}:\n                _LOGGER.error("Paramètre BSB %s d'écart indisponible", offset_parameter)\n                return\n\n            duration = self._preferred_override_duration()\n            duration_key, duration_parameter = _PARAM[self._circuit]["override_duration"]\n            duration_entity = self._source(duration_key, duration_parameter)\n            if not duration_entity or duration_entity.split(".", 1)[0] not in {"number", "text"}:\n                _LOGGER.error("Paramètre BSB %s de durée indisponible", duration_parameter)\n                return\n\n            await async_set_numeric_entity(self.hass, offset_entity, offset)\n            await async_set_numeric_entity(self.hass, duration_entity, duration)\n            override_entity, plus_cold_option = self._override_option(0)\n            await async_select_option(self.hass, override_entity, plus_cold_option)\n            await async_poll_parameters(\n                self.hass,\n                (offset_parameter, duration_parameter, _PARAM[self._circuit]["override"][1],\n                 _PARAM[self._circuit]["effective_setpoint"]),\n            )\n        except asyncio.CancelledError:\n            return\n        except Exception:\n            _LOGGER.exception("Échec de l'envoi de la dérogation native du circuit %s", self._circuit)\n        finally:\n            self._pending_override_task = None\n            self._pending_target_temperature = None\n            self._pending_base_temperature = None\n            self.async_write_ha_state()\n\n    async def async_set_temperature(self, **kwargs) -> None:\n        """Aggregate Climate clicks for 2 s, then create one native override."""\n        temperature = kwargs.get("temperature")\n        if temperature is None:\n            return\n\n        mode = self._mode()\n        if mode == MODE_OFF:\n            raise HomeAssistantError("La PAC est arrêtée : aucune dérogation n’a été envoyée.")\n        if mode != MODE_COOL:\n            raise HomeAssistantError(\n                "La dérogation depuis Home Assistant reste limitée au rafraîchissement "\n                "tant que le comportement chauffage n’a pas été validé sur le bus."\n            )\n\n        override_active, _override_code, _override_text = self._override_state()\n        if override_active is True:\n            raise HomeAssistantError(\n                "Une dérogation native est déjà active. Annule-la avec le bouton du "\n                "circuit avant de choisir une nouvelle consigne."\n            )\n        if override_active is None:\n            raise HomeAssistantError(\n                "Impossible de confirmer l’état 701/1001 de la dérogation. Aucune "\n                "commande n’a été envoyée."\n            )\n\n        if self._pending_base_temperature is None:\n            base = state_float(\n                self.hass,\n                self._source(\n                    f"effective_setpoint_c{self._circuit}",\n                    _PARAM[self._circuit]["effective_setpoint"],\n                ),\n            )\n            if base is None:\n                raise HomeAssistantError(\n                    "Consigne effective 8741/8771 indisponible : impossible de calculer "\n                    "l’écart de dérogation en sécurité."\n                )\n            self._pending_base_temperature = base\n        else:\n            base = self._pending_base_temperature\n\n        requested = round_temperature_step(float(temperature), TEMPERATURE_STEP)\n        if requested > base:\n            raise HomeAssistantError(\n                "Seule une consigne plus froide est actuellement autorisée. "\n                "Le sens ‘Plus chaud’ n’a pas encore été validé sur le bus."\n            )\n\n        offset = round(base - requested, 1)\n        if offset > 5.0:\n            raise HomeAssistantError(\n                f"Écart demandé {offset:.1f} °C hors plage de sécurité 0,1–5,0 °C."\n            )\n        if offset < 0.1:\n            self._cancel_pending_override()\n            self._pending_target_temperature = None\n            self._pending_base_temperature = None\n            self.async_write_ha_state()\n            return\n\n        self._pending_target_temperature = requested\n        self._cancel_pending_override()\n        self._pending_override_task = self.hass.async_create_task(\n            self._async_apply_pending_override(),\n            f"alfea_override_c{self._circuit}_debounce",\n        )\n        self.async_write_ha_state()\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('    async def async_added_to_hass(self) -> None:\n        data = self._entry.data\n', '    async def async_added_to_hass(self) -> None:\n        self.async_on_remove(self._cancel_pending_override)\n        data = self._entry.data\n', 1)
          climate.write_text(s)

          # Manifest / HACS metadata.
          manifest = comp / 'manifest.json'
          data = json.loads(manifest.read_text())
          data['version'] = '1.3.1'
          data['documentation'] = 'https://github.com/Jrmysmallstep/home-assistant-atlantic-alfea-bsb-lan#readme'
          data['issue_tracker'] = 'https://github.com/Jrmysmallstep/home-assistant-atlantic-alfea-bsb-lan/issues'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # README version marker.
          readme = root / 'README.md'
          r = readme.read_text().replace('> Version actuelle : **1.3.0**', '> Version actuelle : **1.3.1**')
          r = r.replace('La V1.3.0 utilise', 'La V1.3.1 utilise').replace('Limitation de sécurité de la V1.3.0', 'Limitation de sécurité de la V1.3.1')
          readme.write_text(r)

          # Changelog.
          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text()
          entry = '''## 1.3.1\n\nVersion de consolidation de la branche 1.3 pour validation via HACS.\n\n### Corrigé\n\n- Classement plus clair des entités avec un préfixe cohérent `Circuit 1` / `Circuit 2`.\n- Temporisation de 2 secondes après le dernier clic `+/- 0,5 °C` dans le Climate ; chaque nouveau clic relance les 2 s et une seule commande BSB finale est envoyée.\n- Le `water_heater` n'affiche plus le code numérique brut dans `etat_ecs_bsb` : `Charge, température nominale` remplace `99 - Charge, température nominale`.\n\n### HACS / Home Assistant\n\n- Ajout d'une icône locale pour HACS et Home Assistant 2026.3+.\n- Ajout des liens `documentation` et `issue_tracker` au manifeste.\n\n'''
          if '## 1.3.1' not in old:
              changelog.write_text(old.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1))

          # Simple 256x256 PNG brand icon, generated with stdlib only.
          def png_chunk(kind: bytes, payload: bytes) -> bytes:
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)

          w = h = 256
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # transparent background, dark blue circular badge, white snowflake/heat-pump mark
                  dx, dy = x - 128, y - 128
                  inside = dx*dx + dy*dy <= 104*104
                  if inside:
                      rgba = [35, 76, 132, 255]
                      # central snowflake: vertical/horizontal/diagonal arms
                      if abs(dx) <= 7 or abs(dy) <= 7 or abs(dx-dy) <= 7 or abs(dx+dy) <= 7:
                          if abs(dx) <= 72 and abs(dy) <= 72:
                              rgba = [255, 255, 255, 255]
                  else:
                      rgba = [0, 0, 0, 0]
                  row.extend(rgba)
              rows.append(bytes(row))
          raw = b''.join(rows)
          png = b'\x89PNG\r\n\x1a\n' + png_chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + png_chunk(b'IDAT', zlib.compress(raw, 9)) + png_chunk(b'IEND', b'')
          for path in [root / 'brand' / 'icon.png', comp / 'brand' / 'icon.png']:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(png)
          PY
          python -m compileall -q custom_components/atlantic_alfea_controller

      - name: Commit v1.3.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/atlantic_alfea_controller README.md CHANGELOG.md brand/icon.png
          git commit -m "Release v1.3.1: debounce, ECS display, entity grouping and brand icon"
          git push origin main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view V1.3.1 >/dev/null 2>&1; then
            echo "Release V1.3.1 already exists"
          else
            gh release create V1.3.1 --target main --title "Atlantic Alfea BSB-LAN v1.3.1" --notes "## Atlantic Alfea BSB-LAN v1.3.1\n\n- Regroupement des entités par circuit pour une lecture plus claire.\n- Temporisation Climate de 2 s après le dernier clic +/- 0,5 °C, avec une seule commande BSB finale.\n- Nettoyage de l'affichage ECS : suppression du code brut 99 dans le water_heater.\n- Icône intégrée pour HACS et Home Assistant 2026.3+.\n- Métadonnées HACS/manifest complétées."
          fi
